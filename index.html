<!DOCTYPE html>
<html lang="uk" data-theme="military">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v15.8</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root, [data-theme="military"]{
  --bg:#050a10; --panel:rgba(8,16,24,.92); --panel-solid:#0b1520;
  --text:#e8f0f5; --muted:#7a8f9e; --accent:#22d3ee; --accent-soft:rgba(34,211,238,.15);
  --danger:#ef4444; --ok:#34d399; --warn:#fbbf24;
  --border:rgba(34,211,238,.18); --header-bg:rgba(5,10,16,.94);
  --btn-bg:rgba(12,22,32,.9); --btn-border:rgba(148,163,184,.22);
  --event-border:#132028; --glow:0 0 12px rgba(34,211,238,.35);
  --radius:12px; --font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{min-height:42px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 12px;padding-top:calc(6px + var(--safe-top));z-index:1000;backdrop-filter:blur(16px);flex:0 0 auto;font-size:12px;gap:8px}
.logo{font-weight:800;letter-spacing:.06em;font-size:11px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--font)}
.logo-icon{font-size:14px;filter:drop-shadow(0 0 6px var(--accent))}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.search-box{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;overflow:hidden;height:32px;flex:1;max-width:260px;min-width:100px}
.search-box input{background:transparent;border:0;color:var(--text);padding:0 12px;font-size:12px;width:100%;outline:none;font-family:var(--font-ui)}
.search-box input::placeholder{color:var(--muted)}
.search-box button{background:transparent;border:0;color:var(--accent);width:34px;height:32px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.search-box button:active{background:var(--accent-soft)}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--font);letter-spacing:.04em}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);transition:background .3s,box-shadow .3s}
.status-dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.ballistic-timer{display:none;padding:0 10px;height:32px;border-radius:999px;align-items:center;justify-content:center;font-family:var(--font);font-weight:900;font-size:12px;line-height:1;color:#fff;background:#7c2d12;border:2px solid #fca5a5;box-shadow:0 0 12px rgba(220,38,38,.7);letter-spacing:.04em;flex:0 0 auto;min-width:66px;white-space:nowrap;animation:btPulse 1s ease-in-out infinite}
.ballistic-timer.show{display:inline-flex}
@keyframes btPulse{0%,100%{box-shadow:0 0 12px rgba(220,38,38,.7);transform:scale(1)}50%{box-shadow:0 0 24px rgba(220,38,38,1);transform:scale(1.04)}}
.search-results{position:absolute;top:calc(48px + var(--safe-top));right:10px;left:10px;z-index:5000;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:400px;margin-left:auto;max-height:260px;overflow-y:auto;width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.55);backdrop-filter:blur(12px)}
.search-results.show{display:block}
.search-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.search-item:last-child{border-bottom:0}
.search-item:hover,.search-item.active{background:rgba(59,130,246,.18)}
.search-item .name{font-weight:700;color:var(--text)}
.search-item .addr{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
[data-theme="military"] #map{background:#dbe4ee}
.top-alert{position:absolute;top:calc(48px + var(--safe-top) + 8px);left:6px;right:6px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.falling{background:linear-gradient(90deg,#78350f,#f59e0b,#78350f);color:#fff;border:1px solid #fcd34d}
.top-alert.shot{background:linear-gradient(90deg,#14532d,#16a34a,#14532d);color:#fff;border:1px solid #86efac}
.top-alert.fire{background:linear-gradient(90deg,#7c2d12,#f97316,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.strategic{background:linear-gradient(90deg,#78350f,#facc15,#78350f);color:#1f2937;border:1px solid #fde047}
.top-alert.mass{background:linear-gradient(90deg,#4c1d95,#7c3aed,#4c1d95);color:#fff;border:1px solid #c4b5fd;animation:massPulse 1.2s ease-in-out infinite}
@keyframes massPulse{0%,100%{background:linear-gradient(90deg,#4c1d95,#7c3aed,#4c1d95)}50%{background:linear-gradient(90deg,#7c3aed,#a78bfa,#7c3aed)}}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top-alert-place{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top-alert-meta{font-size:.68rem;font-weight:700;opacity:.85;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0}
.mass-banner{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4620;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6);backdrop-filter:blur(10px);background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block;animation:alertIn .3s ease-out}
.mass-banner-inner{padding:10px 34px 10px 12px;display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:.8rem;line-height:1.35}
.mass-banner-icon{font-size:1.5rem;flex-shrink:0;line-height:1}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem;letter-spacing:.02em}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px;opacity:.95}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0}
.strategic-panel{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4550;background:rgba(15,23,42,.95);border:1px solid rgba(250,204,21,.5);border-radius:10px;padding:8px 12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);backdrop-filter:blur(10px);font-size:.72rem;max-height:30vh;overflow-y:auto}
.strategic-panel.show{display:block}
.strategic-panel-title{font-weight:800;color:#facc15;margin-bottom:6px;font-size:.78rem;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center}
.strategic-panel-close{background:0;border:0;color:#facc15;font-size:1.1rem;cursor:pointer;padding:0 4px;line-height:1}
.strategic-panel-item{color:#e2e8f0;padding:3px 0;border-bottom:1px solid rgba(148,163,184,.15);display:flex;align-items:flex-start;gap:6px}
.strategic-panel-item:last-child{border-bottom:0}
.strategic-panel-item .s-ico{flex-shrink:0}
.strategic-panel-item .s-text{flex:1;min-width:0}
.strategic-panel-item .s-eta{color:#fbbf24;font-weight:700;font-size:.68rem}
.strategic-panel-summary{color:#fca5a5;font-weight:800;margin-top:6px;padding-top:6px;border-top:1px solid rgba(220,38,38,.4);font-size:.7rem}
.panel{position:absolute;left:6px;right:6px;bottom:calc(54px + var(--safe-bottom));background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;z-index:900;backdrop-filter:blur(18px);display:flex;flex-direction:column;max-height:20vh;transition:max-height .22s ease;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.panel.collapsed{max-height:40px}
.panel-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;height:40px;flex:0 0 40px}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:6px;font-family:var(--font);text-transform:uppercase}
.panel-count{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.panel-chev{font-size:.7rem;color:var(--muted);transition:transform .2s}
.panel.collapsed .panel-chev{transform:rotate(-90deg)}
.events{overflow-y:auto;flex:1;min-height:0;padding:4px 8px 8px}
.event{padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--event-border);border-left:3px solid var(--accent);cursor:pointer;transition:background .12s,border-color .12s;background:rgba(0,0,0,.2)}
.event:hover{background:var(--accent-soft)}
.event:last-child{margin-bottom:0}
.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.event-type{font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-icon{font-size:13px;line-height:1;flex-shrink:0}
.event-prio{color:var(--warn);font-size:11px;flex-shrink:0}
.event-time{font-size:10px;color:var(--muted);flex-shrink:0;font-weight:700;font-family:var(--font)}
.event-loc{margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:1px 5px;border-radius:4px;background:#132630;color:#8faab8;font-size:8px;font-weight:700;line-height:1.4}
.tag.prio{background:rgba(251,191,36,.25);color:#fbbf24}
.tag.stage-launch{background:rgba(220,38,38,.3);color:#fecaca}
.tag.stage-impact{background:rgba(220,38,38,.4);color:#fecaca}
.tag.speed{background:rgba(59,130,246,.3);color:#93c5fd}
.tag.strategic{background:rgba(250,204,21,.3);color:#fde047}
.tag.mass{background:rgba(124,58,237,.4);color:#ddd6fe}
.tag.drone-id{background:rgba(239,68,68,.35);color:#fecaca;font-weight:800}
.panel-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:10px}
.hud-bottom{position:absolute;bottom:calc(14px + var(--safe-bottom));left:0;right:0;z-index:1000;padding:0 6px 0;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;background:var(--panel);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(18px);box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%}
.btn-row::-webkit-scrollbar{display:none}
.btn-row button{border-radius:999px;min-width:36px;height:36px;flex:1;border-color:transparent;background:transparent}
.btn-row button:active{background:var(--accent-soft)}
button{background:var(--btn-bg);backdrop-filter:blur(14px);border:1px solid var(--btn-border);color:var(--text);padding:0;border-radius:var(--radius);font-size:.95rem;line-height:1;cursor:pointer;font-weight:700;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;touch-action:manipulation;transition:border-color .15s,box-shadow .15s,background .15s}
button:active{background:var(--accent-soft)}
button.danger{color:#fca5a5}
button.on{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
button.scope-btn.on{color:#22d3ee}
button.siren-btn{color:var(--danger)}
button.siren-btn.active{background:var(--danger)!important;color:#fff!important;animation:sirenFlash .35s ease-in-out infinite;border-color:var(--danger)}
button.infra-btn.infrastructure{border-color:#3b82f6;color:#93c5fd;box-shadow:0 0 10px rgba(59,130,246,.3)}
button.infra-btn.energy{border-color:var(--warn);color:var(--warn)}
button.infra-btn.incidents{border-color:var(--danger);color:#fca5a5}
button.sound-btn.muted{color:var(--danger);border-color:transparent;box-shadow:none;background:var(--btn-bg)}
button.sound-btn.on{color:var(--ok)}
button.mass-btn.on{color:#c4b5fd;border-color:#a78bfa}
button.fs-btn.on{background:rgba(99,102,241,.9);color:#fff}
@keyframes sirenFlash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.dev-signature{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;pointer-events:none;z-index:1100;font-family:var(--font);padding:1px 0 calc(1px + var(--safe-bottom));line-height:1.3;opacity:.9;color:#3b82f6}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:rgba(7,16,24,.97)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:250px}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important;padding:2px 6px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.popup-meta{color:#94a3b8;font-size:.68rem}
.popup-guess{color:#fbbf24;font-size:.66rem;margin-top:4px}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0;border:1px solid rgba(148,163,184,.3)}
.popup-channels .ch.trusted{background:rgba(22,163,74,.25);border-color:rgba(134,239,172,.4);color:#86efac}
.popup-channels .ch.prio{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.5);color:#fbbf24}
.popup-channels .ch.suspicious{background:rgba(220,38,38,.25);border-color:rgba(248,113,113,.4);color:#fca5a5}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}
.popup-remove-btn:active{background:rgba(220,38,38,.5)}
.popup-toggle-btn{margin-top:6px;width:100%;height:30px;font-size:.75rem;background:rgba(34,211,238,.2);border:1px solid rgba(34,211,238,.5);color:#67e8f9;border-radius:6px;cursor:pointer;font-weight:800}
.popup-toggle-btn:active{background:rgba(34,211,238,.4)}
.popup-speed{background:rgba(234,88,12,.3);color:#fdba74;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(253,186,116,.5);letter-spacing:.02em}
.popup-eta{background:rgba(220,38,38,.25);color:#fca5a5;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.4)}
.popup-dist{background:rgba(59,130,246,.25);color:#93c5fd;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(147,197,253,.4)}
.popup-alt{background:rgba(22,163,74,.25);color:#86efac;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(134,239,172,.4)}
.popup-stale{background:rgba(217,119,6,.25);color:#fcd34d;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.66rem;display:inline-block;margin-top:4px;border:1px solid rgba(251,191,36,.4)}
.popup-exactname{background:rgba(220,38,38,.3);color:#fecaca;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.5);letter-spacing:.02em}
.popup-drone-id{background:rgba(239,68,68,.4);color:#fecaca;padding:3px 8px;border-radius:5px;font-weight:900;font-size:.75rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.6);letter-spacing:.04em}
.popup-route{background:rgba(59,130,246,.2);color:#bfdbfe;padding:4px 8px;border-radius:5px;font-weight:700;font-size:.7rem;display:block;margin-top:4px;border:1px solid rgba(147,197,253,.4)}
.popup-route .arrow{color:#fbbf24;font-weight:900;margin:0 4px}
.popup-infra{background:rgba(217,119,6,.35);color:#fcd34d;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(251,191,36,.5);letter-spacing:.02em}
.popup-chornobyl{background:rgba(168,85,247,.35);color:#e9d5ff;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(216,180,254,.5)}
.popup-trail{margin-top:6px;padding:6px 8px;border-radius:5px;background:rgba(148,163,184,.12);border:1px dashed rgba(148,163,184,.5);font-size:.68rem;line-height:1.45;color:#cbd5e1;max-height:150px;overflow-y:auto}
.popup-trail .pt-title{font-weight:700;color:#e2e8f0;margin-bottom:3px}
.popup-trail .pt-point{display:flex;gap:5px;align-items:flex-start;margin:1px 0}
.popup-trail .pt-num{flex-shrink:0;font-family:ui-monospace,monospace;color:#94a3b8;min-width:14px}
.popup-trail .pt-place{flex:1;color:#e2e8f0}
.popup-trail .pt-time{color:#94a3b8;font-size:.6rem;margin-left:3px}
.popup-trail .pt-arrow{color:#fbbf24;font-weight:800}
.threat-wrap{position:relative;width:28px;height:28px}
.threat-rotate{position:absolute;inset:0;transform-origin:center center;will-change:transform}
.threat-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite}
.threat-icon svg{width:24px;height:24px;display:block}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.55));opacity:.92}}
.threat-icon.confirm-2{filter:drop-shadow(0 0 7px rgba(34,197,94,.9))}
.threat-icon.confirm-3{filter:drop-shadow(0 0 10px rgba(250,204,21,.95));animation:cPulse 1.3s ease-in-out infinite}
.threat-icon.confirm-5{filter:drop-shadow(0 0 14px rgba(250,204,21,1));animation:cPulse 1s ease-in-out infinite}
@keyframes cPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.threat-icon.falling{animation:fallingBlink .55s ease-in-out infinite}

   = включая восстановленную логику маркеров прилётов (fallback)

"use strict";

/* ==================== 1. LOG ==================== */
const RadarLog = (() => {
  const buf = [];
  const MAX = 200;
  function push(scope, msg, err) {
    const rec = { t: Date.now(), scope, msg: String(msg), stack: err && err.stack ? String(err.stack).slice(0, 400) : null };
    buf.push(rec);
    if (buf.length > MAX) buf.shift();
    console.warn(`[radar:${scope}]`, msg, err || "");
  }
  function showBanner(m) {
    try { const b = document.getElementById("errBanner"), t = document.getElementById("errText");
      if (b && t) { t.textContent = String(m || "?"); b.classList.add("show"); } } catch (e) {}
  }
  return { push, showBanner, all: () => buf.slice() };
})();
window.addEventListener("error", e => RadarLog.showBanner(e.message));
window.addEventListener("unhandledrejection", e => {
  try { RadarLog.showBanner(e.reason?.message || String(e.reason)); } catch (x) {}
});

/* ==================== 2. UTILS ==================== */
const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const norm = s => (s || "").toLowerCase()
  .replace(/[’`´']/g, "'")
  .replace(/[^\p{L}\p{N}\s'-]/gu, " ")
  .replace(/\s+/g, " ").trim();

function Lon(o) {
  if (o == null) return null;
  if (typeof o.lon === "number") return o.lon;
  if (typeof o.lng === "number") return o.lng;
  if (typeof o.longitude === "number") return o.longitude;
  return null;
}
function normLon(p) {
  if (!p) return p;
  const l = Lon(p);
  if (l != null) { p.lon = l; p.lng = l; }
  return p;
}
function haversineKm(a, b, c, d) {
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLat = toR(c - a), dLon = toR(d - b);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a)) * Math.cos(toR(c)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearingBetween(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function destPoint(lat, lon, brg, distKm) {
  const R = 6371, br = brg * Math.PI / 180, lat1 = lat * Math.PI / 180, lon1 = lon * Math.PI / 180;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distKm / R) + Math.cos(lat1) * Math.sin(distKm / R) * Math.cos(br));
  const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(distKm / R) * Math.cos(lat1), Math.cos(distKm / R) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
}
function compassName(deg) {
  if (deg == null || !Number.isFinite(deg)) return "—";

  const i = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
  return dirs[i];
}

    if (!u) return null;
    const km = haversineKm(u.lat, u.lon, lat, lon);

}

function levenshtein(a, b) {
  a = (a || "").toLowerCase(); b = (b || "").toLowerCase();
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + c);
  }
  return dp[m][n];
}

}

const PRIORITY_WEIGHT = 3.0;
function normalizeChannel(ch) {
  if (!ch) return "unknown";
  let k = String(ch).trim();
  k = k.replace(/^@/, "");
  k = k.replace(/^https?:\/\/(?:t\.me|telegram\.me)\//i, "");
  k = k.replace(/\/+$/, "");
  k = k.toLowerCase().replace(/\s+/g, "_");
  k = k.replace(/_bot$/, "").replace(/_channel$/, "");
  return k || "unknown";
}
function isPriorityChannel(ch) {
  const k = normalizeChannel(ch);
  if (PRIORITY_CHANNELS.has(k)) return true;
  for (const p of PRIORITY_CHANNELS) if (k.includes(p)) return true;
  return false;
}
function channelWeight(name) {
  if (isPriorityChannel(name)) return PRIORITY_WEIGHT;
  const k = normalizeChannel(name);
  if (CHANNEL_WEIGHTS[k] != null) return CHANNEL_WEIGHTS[k];
  for (const [key, w] of Object.entries(CHANNEL_WEIGHTS)) if (k.includes(key)) return w;
  return 1.0;
}
function channelClass(name) {
  if (isPriorityChannel(name)) return "prio";
  const w = channelWeight(name);
  if (w >= 1.5) return "trusted";
  if (w >= 1.0) return "";
  return "suspicious";
}
function uniqueChannels(setOrArr) {
  const out = new Set();
  if (!setOrArr) return out;
  for (const ch of setOrArr) out.add(normalizeChannel(ch));
  return out;
}
function uniqueChannelCount(setOrArr) {
  if (!setOrArr) return 0;
  if (setOrArr instanceof Set) return setOrArr.size;
  if (Array.isArray(setOrArr)) return uniqueChannels(setOrArr).size;
  if (typeof setOrArr.size === "number") return setOrArr.size;
  return uniqueChannels(setOrArr).size;
}
function totalWeightOf(set) {
  let w = 0;
  for (const ch of uniqueChannels(set)) w += channelWeight(ch);
  return w;
}
function hasPrioritySource(channels) {
  for (const ch of uniqueChannels(channels)) if (isPriorityChannel(ch)) return true;
  return false;
}
function confirmStats(channels) {
  const uniq = uniqueChannels(channels);
  const n = uniq.size;
  const tw = totalWeightOf(uniq);
  const prio = hasPrioritySource(uniq);
  return { confirmN: n, totalW: tw, hasPrio: prio, channels: uniq };
}
function isAltitudeChannel(c) {

const _iconCache = new Map();

function iconCacheKey(cls, heading, confirmN, tw, stale, uncertain, aiLevel, stage, inSiren, hasPriority, isSimulated, speed, arrived) {

const CLASSIFIER = (() => {
  const RULES = [
    {re:/ту-?\s*95|ту-?\s*160|ту-?\s*22\s*м?3?|стратег[іи]чн[а-яіїєґ]*\s*авіац|стратегическ[а-я]*\s*авиац/i,type:"strategic_aviation",label:"Стратег. авіація",isStrategic:true,base:0.92,hard:true},
    {re:/а-?50\s?у/i,type:"awacs",label:"А-50У",isAwacs:true,base:0.9,hard:true},
    {re:/циркон|zircon|3м22|3m22/i,type:"zircon",label:"Циркон",isMissile:true,isZircon:true,base:0.95,hard:true},
    {re:/кінжал|кинжал/i,type:"ballistic",label:"Кинжал",isMissile:true,base:0.94,hard:true,exactHint:"Кинжал"},
    {re:/іскандер|искандер/i,type:"ballistic",label:"Іскандер",isMissile:true,base:0.93,hard:true},
    {re:/кн-?23|kn-?23/i,type:"ballistic",label:"KN-23",isMissile:true,base:0.93,hard:true},
    {re:/балістік|баллистик/i,type:"ballistic",label:"Бал",isMissile:true,base:0.85,hard:true},
    {re:/реактивн[а-яіїєґ]*\s*(шахед|геран|бпла|дрон)|jet\s*drone|реактивн[а-яіїєґ]*\s*бпла/i,type:"jet_drone",label:"Реакт. БПЛА",isJetDrone:true,base:0.9,hard:true},
    {re:/ум[пб]б/i,type:"umpb",label:"УМПБ-5",isMissile:true,base:0.88,hard:true},
    {re:/мгкр|мг\s*кр|бандерол|s\s*[-]?\s*8000|бандероль/i,type:"banderol",label:"S8000",isMissile:true,base:0.88,hard:true},
    {re:/герань\s*-?\s*5|geran\s*-?\s*5|gerbera\s*-?\s*5/i,type:"geran5",label:"Герань-5",isGeran5:true,isGeran:true,base:0.92,hard:true},
    {re:/герань\s*-?\s*4|geran\s*-?\s*4/i,type:"geran4",label:"Герань-4",isGeran:true,base:0.9,hard:true},
    {re:/герань\s*-?\s*3|geran\s*-?\s*3/i,type:"geran3",label:"Герань-3",isGeran:true,base:0.9,hard:true},
    {re:/герань\s*-?\s*2|geran\s*-?\s*2/i,type:"geran2",label:"Герань-2",isGeran:true,base:0.9,hard:true},
    {re:/каб\b|kab\b|уаб\b/i,type:"kab",label:"КАБ",isMissile:true,base:0.86,hard:true},
    {re:/крилат[аиі]?\s+ракет|крилата\s+ракет|х-?\s*101|х-?\s*555|калібр|калибр|kalibr/i,type:"missile",label:"КР",isMissile:true,base:0.88,hard:true},
    {re:/оникс|онікс|oniks|p-?800/i,type:"missile",label:"Онікс",isMissile:true,base:0.9,hard:true},
    {re:/миг-?31|міг-?31|mig-?31/i,type:"mig31k",label:"МиГ-31К",isMig:true,base:0.9,hard:true},
    {re:/fpv|фпв/i,type:"fpv",label:"FPV",base:0.75,hard:false},
    {re:/розвідник|разведчик|recon/i,type:"recon",label:"Розв",isRecon:true,base:0.72,hard:false},
    {re:/шахед|shahed|герань|geran|гербера|бпла|дрон|безпілотник|беспилотник/i,type:"uav",label:"БПЛА",base:0.55,hard:false}
  ];
  return function(text) {
    text = text || "";
    let best = null, bestScore = -1;
    for (let i = 0; i < RULES.length; i++) {
      const r = RULES[i];
      if (!r.re.test(text)) continue;
      let score = r.base + (RULES.length - i) * 0.0001;
      if (/герань\s*-?\s*[2-5]|geran\s*-?\s*[2-5]|шахед\s*-?\s*\d|іскандер|кинжал|циркон|калибр|х-?\s*10[15]/i.test(text)) score += 0.04;
      if (score > bestScore) {
        bestScore = score;
        best = {
          type: r.type, label: r.label, hard: !!r.hard, re: r.re,

          isStrategic: !!r.isStrategic, isAwacs: !!r.isAwacs, isMissile: !!r.isMissile,
          isZircon: !!r.isZircon, isJetDrone: !!r.isJetDrone, isGeran: !!r.isGeran,
          isGeran5: !!r.isGeran5, isMig: !!r.isMig, isRecon: !!r.isRecon
        };
      }
    }
    return best;
  };
})();

function classifyThreat(text) {
  const cls = CLASSIFIER(text);
  if (!cls) return null;
  const exact = detectExactName(text);
  return { ...cls, exactName: exact || null };
}

function detectExactName(text) {
  if (!text) return null;
  const tt = text.toLowerCase();
  let m = tt.match(/герань\s*-?\s*([2-5])\b/); if (m) return `Герань-${m[1]}`;
  m = tt.match(/(?:шахед|shahed)\s*-?\s*(\d{2,3})\b/); if (m) return `Шахед-${m[1]}`;
  if (/реактивн/.test(tt) && /(шахед|геран|бпла|дрон)/.test(tt)) return "Реактивний БПЛА";
  if (/(розвідник|разведчик|recon)/.test(tt)) return "Розвідник";
  if (/fpv|фпв/.test(tt)) return "FPV";
  m = tt.match(/іскандер\s*-?\s*([мк])/i); if (m) return `Іскандер-${m[1].toUpperCase()}`;
  if (/іскандер|искандер/i.test(tt)) return "Іскандер";
  if (/кинжал|кінжал/.test(tt)) return "Кинжал";
  if (/циркон|zircon|3м22/.test(tt)) return "Циркон";
  if (/калибр|калібр/.test(tt)) return "Калибр";
  m = tt.match(/х-?\s*(\d{2,3})/); if (m) return `Х-${m[1]}`;
  if (/оникс|онікс|oniks/.test(tt)) return "Онікс";
  if (/кн-?23|kn-?23/i.test(tt)) return "KN-23";
  return null;
}

  function removeTrackInternal(id) {

    try { if (tr._pathLine && map) map.removeLayer(tr._pathLine); } catch (e) {}
    try { if (tr._predLine && map) map.removeLayer(tr._predLine); } catch (e) {}

})();

/* ==================== 12. AUDIO ==================== */
const Audio = (() => {
  let ctx = null, keepAlive = null, lastSoundAt = 0, sirenBtnTimer = null;
  let lastBallisticAlarmAt = 0;
  function init() {
    if (ctx) return ctx;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      ctx = new Ctx();
      startKeepAlive();
    } catch (e) { ctx = null; }
    return ctx;
  }
  function startKeepAlive() {
    if (keepAlive) return;
    keepAlive = setInterval(() => {
      if (!ctx) return;
      try {
        if (ctx.state === "suspended") { ctx.resume().catch(() => {}); return; }
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(1, ctx.currentTime);
        g.gain.setValueAtTime(0.00001, ctx.currentTime);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }, 20000);
  }
  function unlock() { const c = init(); if (c && c.state === "suspended") c.resume().catch(() => {}); }
  function playBell() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [{f:880,g:.30,d:1.1},{f:1760,g:.14,d:.7},{f:2640,g:.07,d:.45}].forEach(p => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(p.f, now);
      g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(p.g, now + .012);
      g.gain.exponentialRampToValueAtTime(.0001, now + p.d);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + p.d + .05);
    });
  }
  function playAlert(force) {
    if (!CONFIG.SOUND_ENABLED) return;
    const now = Date.now();
    if (!force && now - lastSoundAt < CONFIG.SOUND_COOLDOWN_MS) return;
    lastSoundAt = now;
    const c = init(); if (!c) return;
    try { if (c.state === "suspended") c.resume(); playBell(); } catch (e) {}
  }
  function playSirenOnce(dur = 3000) {
    const c = init(); if (!c) return;
    if (c.state === "suspended") c.resume();
    const n = c.currentTime, d = dur / 1000;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(440, n);
    o.frequency.linearRampToValueAtTime(880, n + d * .25);
    o.frequency.linearRampToValueAtTime(660, n + d * .6);
    o.frequency.linearRampToValueAtTime(440, n + d);
    f.type = "bandpass"; f.frequency.value = 800; f.Q.value = 3;
    g.gain.setValueAtTime(.0001, n);
    g.gain.linearRampToValueAtTime(.35, n + .1);
    g.gain.setValueAtTime(.35, n + d - .15);
    g.gain.linearRampToValueAtTime(.0001, n + d);
    o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(n); o.stop(n + d + .05);
  }
  function flashSirenBtn(d) {
    const b = $("sirenBtn"); if (!b) return;
    b.classList.add("active");
    if (sirenBtnTimer) clearTimeout(sirenBtnTimer);
    sirenBtnTimer = setTimeout(() => b.classList.remove("active"), d || 3000);
  }
  function triggerSirenSequence(dur = 3000, times = 1) {
    const n = Math.max(1, times || 1);
    flashSirenBtn(dur * n + (n - 1) * 250);
    for (let i = 0; i < n; i++) setTimeout(() => playSirenOnce(dur), i * (dur + 250));
  }
  function triggerBallisticAlarm(reason) {
    const now = Date.now();
    if (now - lastBallisticAlarmAt < CONFIG.BALLISTIC_SIREN_COOLDOWN_MS) return false;
    lastBallisticAlarmAt = now;
    triggerSirenSequence(3000, 3);
    Alerts.showTopAlert({
      kind: "ballistic", icon: "🚨",
      title: t("alert.ballistic.title"), place: t("alert.ballistic.place"), meta: t("alert.ballistic.meta")
    });
    if ("speechSynthesis" in window) {
      try {
        const u = new SpeechSynthesisUtterance("Увага! Загроза балістики! Перейдіть до укриття!");
        u.lang = "uk-UA";
        u.rate = .95; u.pitch = 1.05; u.volume = 1.0;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch (e) {}
    }
    return true;
  }
  function isRocketType(ty) { return ROCKET_TYPES.has(ty); }
  function soundThresholdFor(ty) { return isRocketType(ty) ? CONFIG.SOUND_NEAR_KM_ROCKET : CONFIG.SOUND_NEAR_KM; }
  function fireSirenForTarget(key, clsLike, ch) {
    if (!clsLike) return false;
    if (!SOUND_TYPE_FILTER.has(clsLike.type) && !clsLike.isGeran5) return false;
    if (ch && !isPriorityChannel(ch)) return false;
    const now = Date.now();
    const last = State.firedSoundKeys.get(key) || 0;
    const win = isRocketType(clsLike.type) ? CONFIG.SOUND_NEAR_WINDOW_MS_ROCKET : CONFIG.SOUND_NEAR_WINDOW_MS;
    if (now - last < win) return false;
    State.firedSoundKeys.set(key, now);
    if (State.firedSoundKeys.size > 300) {
      const cutoff = now - 10 * 60 * 1000;
      for (const [k, v] of State.firedSoundKeys) if (v < cutoff) State.firedSoundKeys.delete(k);
    }
    playAlert(true);
    return true;
  }
  function maybeSirenForPlace(key, cls, lat, lon, ch) {
    if (!CONFIG.SOUND_ENABLED) return;
    if (!isPriorityChannel(ch)) return;
    if (!SOUND_TYPE_FILTER.has(cls.type) && !cls.isGeran5) return;
    if (lat == null || lon == null) return;
    const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], lat, lon);
    if (d > soundThresholdFor(cls.type)) return;
    fireSirenForTarget("msg:" + cls.type + ":" + key, cls, ch);
  }
  return {
    init, unlock, playAlert, playSirenOnce, triggerSirenSequence, triggerBallisticAlarm,
    isRocketType, soundThresholdFor, fireSirenForTarget, maybeSirenForPlace, flashSirenBtn
  };
})();

/* ==================== 12.5 ALERT COUNTER ==================== */
const AlertCounter = (() => {
  const KEY = "kyiv_alert_counter_v1";
  let state = { date: "", count: 0, active: false };
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const s = raw ? JSON.parse(raw) : null;
      if (s && s.date === today() && typeof s.count === "number") {
        state = { date: s.date, count: s.count | 0, active: !!s.active };
      } else {
        state = { date: today(), count: 0, active: false };
      }
    } catch (e) { state = { date: today(), count: 0, active: false }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function rollover() { if (state.date !== today()) { state = { date: today(), count: 0, active: false }; save(); } }
  function update(isActiveNow) {
    rollover();
    const now = !!isActiveNow;
    if (now && !state.active) { state.active = true; state.count += 1; save(); }
    else if (!now && state.active) { state.active = false; save(); }
  }
  function getCount() { rollover(); return state.count; }
  function isActive() { rollover(); return state.active; }
  load();
  return { update, getCount, isActive };
})();

/* ==================== 12.6 BALLISTIC COUNTDOWN ==================== */
const BallisticTimer = (() => {
  const BALLISTIC_RE = /балістік|баллистик|кинжал|кінжал|іскандер|искандер|кн[\s\-–]?23|kn[\s\-–]?23|циркон|zircon|3м22|3m22|онікс|оникс|oniks|p[\s\-–]?800|с[\s\-–]?300|с[\s\-–]?400|s[\s\-–]?300|s[\s\-–]?400|орешник|орєшнік|орешнік|oreshnik/i;
  let startedAt = 0;
  let tickTimer = null;
  function render() {
    const el = $("ballisticTimer");
    if (!el) return;
    const left = startedAt ? Math.max(0, CONFIG.BALLISTIC_COUNTDOWN_MS - (Date.now() - startedAt)) : 0;
    if (!startedAt || left <= 0) {
      el.classList.remove("show"); el.textContent = ""; el.style.background = ""; el.style.borderColor = "";
      return;
    }
    const secs = Math.ceil(left / 1000);
    el.textContent = "🚨 " + secs + "s";
    el.classList.add("show");
    if (secs <= 20) { el.style.background = "#7f1d1d"; el.style.borderColor = "#fecaca"; }
    else if (secs <= 60) { el.style.background = "#b91c1c"; el.style.borderColor = "#fca5a5"; }
    else { el.style.background = "#7c2d12"; el.style.borderColor = "#fca5a5"; }
  }
  function ensureTicker() {
    if (tickTimer) return;
    tickTimer = setInterval(() => {
      const left = startedAt ? (Date.now() - startedAt) : Infinity;
      if (!startedAt || left >= CONFIG.BALLISTIC_COUNTDOWN_MS) {
        clearInterval(tickTimer); tickTimer = null; startedAt = 0; render(); return;
      }
      render();
    }, 200);
  }
  function start(fromMs) {
    startedAt = fromMs || Date.now();
    if (Date.now() - startedAt >= CONFIG.BALLISTIC_COUNTDOWN_MS) { startedAt = 0; render(); return; }
    ensureTicker(); render();
  }
  function isActive() { return !!startedAt && (Date.now() - startedAt) < CONFIG.BALLISTIC_COUNTDOWN_MS; }
  function check(text, msgMs) {
    if (!text || !BALLISTIC_RE.test(text)) return false;
    const now = Date.now();
    let ts = msgMs && Number.isFinite(msgMs) ? msgMs : now;
    if (ts > now) ts = now;
    if (now - ts > CONFIG.BALLISTIC_MSG_MAX_AGE_MS) return false;
    if (isActive()) return true;
    start(ts); return true;
  }
  function stop() { startedAt = 0; render(); }
  return { check, start, stop, isActive };
})();

/* ==================== 13. ALERTS ==================== */
const Alerts = (() => {
  const seen = new Map();
  const DISMISS_KEY = "kyiv_radar_dismissed_alerts_v1";
  let timer = null, lastKind = null;
  function loadDismissed() {
    try { const a = JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]"); return new Set(Array.isArray(a) ? a : []); }
    catch (e) { return new Set(); }
  }
  function saveDismissed(key) {
    try { const s = loadDismissed(); s.add(key); localStorage.setItem(DISMISS_KEY, JSON.stringify([...s].slice(-60))); }
    catch (e) {}
  }
  function contentKey(kind, place, meta, rawText) {
    const base = (rawText || meta || "").replace(/\s+/g, " ").slice(0, 80).toLowerCase();
    return (kind || "") + "|" + (place || "") + "|" + base;
  }
  function isSummary(text) {
    if (!text) return false;
    return /(?:протягом\s+(?:минулої|останньої|цієї)\s+доби|за\s+(?:минулу|останню)\s+добу|внаслідок\s+обстріл|за\s+даними\s+(?:ова|хова|сова)|зведення\s+за\s+добу|підсумки\s+(?:доби|дня)|за\s+добу\s+ворог|станом\s+на\s+\d|офіційне\s+зведення)/i.test(text);
  }
  function showTopAlert({kind, icon, title, place, meta, rawText}) {
    const el = $("topAlert"); if (!el) return;
    if (lastKind === "ballistic" && kind !== "ballistic") { if (timer) return; }
    if (isSummary(rawText) || isSummary(meta)) return;
    const key = contentKey(kind, place, meta, rawText);
    if (loadDismissed().has(key)) return;
    const now = Date.now();
    const prev = seen.get(key);
    if (prev && (now - prev) < 15 * 60 * 1000) return;
    seen.set(key, now);
    if (seen.size > 50) for (const [k, v] of seen) if (now - v > 20 * 60 * 1000) seen.delete(k);
    lastKind = kind;
    el.dataset.alertKey = key;
    el.className = "top-alert show " + kind;
    const iconEl = $("topAlertIcon"), titleEl = $("topAlertTitle"), placeEl = $("topAlertPlace"), metaEl = $("topAlertMeta");
    if (iconEl) iconEl.textContent = icon || "🚨";
    if (titleEl) titleEl.textContent = title || "—";
    if (place) { if (placeEl) { placeEl.textContent = place; placeEl.style.display = "block"; } }
    else if (placeEl) placeEl.style.display = "none";
    if (meta) { if (metaEl) { metaEl.textContent = meta; metaEl.style.display = "block"; } }
    else if (metaEl) metaEl.style.display = "none";
    if (timer) clearTimeout(timer);
    const ttl = kind === "ballistic" ? CONFIG.TOP_ALERT_BALLISTIC_TTL_MS : Math.min(CONFIG.TOP_ALERT_TTL_MS, 20000);
    timer = setTimeout(() => hideTopAlert(), ttl);
  }
  function hideTopAlert(permanent) {
    const el = $("topAlert");
    if (el) {
      if (permanent && el.dataset.alertKey) saveDismissed(el.dataset.alertKey);
      el.classList.remove("show"); el.dataset.alertKey = "";
    }
    lastKind = null;
    if (timer) { clearTimeout(timer); timer = null; }
  }
  const DEBRIS_RE = /(?:уламк|обломк|фрагмент[иы]|осколк)/i;
  function showImpact(report, place, text) {
    if (isSummary(text)) return;
    const kind = report.kind;
    let icon = report.icon, title = "";
    if (kind === "hit") { title = t("alert.impact.title"); icon = "💥"; }
    else if (kind === "down") { title = DEBRIS_RE.test(text || "") ? t("alert.debris.title") : t("alert.falling.title"); icon = "🛬"; }
    else if (kind === "shot") { title = t("alert.shot.title"); icon = "🛡️"; }
    else if (kind === "fire") { title = t("alert.fire.title"); icon = "🔥"; }
    else return;
    const placeLine = place && place.name ? place.name : "";
    const shortText = (text || "").replace(/\s+/g, " ").slice(0, 140);
    const meta = (shortText && shortText !== placeLine) ? shortText : "";
    const alertKind = kind === "down" ? "falling" : (kind === "shot" ? "shot" : (kind === "fire" ? "fire" : "impact"));
    showTopAlert({ kind: alertKind, icon, title, place: placeLine, meta, rawText: text || "" });
  }
  return { showTopAlert, hideTopAlert, showImpact, isSummary };
})();

/* ==================== 14. MASS ==================== */
const Mass = (() => {
  const TRIGGER_RE = new RegExp([

  const AIRFIELDS = [

    {key:"gvardeyskoye",re:/гвардійськ|гвардейск/i,name:"Гвардейское",lat:45.10,lon:33.98,region:"Крим"},
    {key:"bryansk",re:/брянськ|брянск/i,name:"Брянськ",lat:53.25,lon:34.37,region:"Брянська"},
    {key:"kursk",re:/курськ|курск/i,name:"Курськ",lat:51.73,lon:36.19,region:"Курська"},

  let bannerTimer = null, active = false;
  const recent = new Map();
  const DEDUP_WINDOW_MS = 3 * 60 * 1000;
  function detect(text) {

    const airports = AIRFIELDS.filter(a => a.re.test(text));
    const lines = [];
    let title = t("mass.title"), icon = "🚀";
    if (/пуск|залп|масован|массированн|одночасн/i.test(text) && /реактивн/i.test(text)) {
      title = t("mass.rockets"); icon = "🚀";
      const m = text.match(/з\s+([А-ЯІЇЄҐа-яіїєґ'’\-\s]+)/i);
      if (m) lines.push(`${t("mass.pusk")}: <b>${esc(m[1].trim())}</b>`);
    }
    if (/підвіз|подвоз|фіксуємо|фиксируем|іскандер|искандер|кн[-–\s]?23|kn[-–\s]?23|балістичних|баллистических/i.test(text)) {
      title = t("mass.ballistic"); icon = "🚀";
      if (/курськ|курск/i.test(text)) lines.push(t("mass.iskander.kursk"));
      if (/брянськ|брянск/i.test(text)) lines.push(t("mass.iskander.bryansk"));
      if (/воронеж/i.test(text)) lines.push(t("mass.kn23.voronezh"));
    }
    if (/доставка|шахед|аеродром|аэродром/i.test(text) && /шахед|реактивн/i.test(text)) {

  function showBanner(info, ch) {

    if (l2) { l2.innerHTML = lines[1] || ""; l2.style.display = lines[1] ? "block" : "none"; }

      State.strategicActivity.set("zircon_kursk", { place: "Курськ", lastSeen: msgMs, channels: new Set([ch]) });

const AI = (() => {

    if (text.length < 8) return {ok:false, reason:"short", spamScore:.8};

  }

    const channels = uniqueChannels(ctx.channels instanceof Set ? ctx.channels : (ctx.channels || []));
    const chWeight = totalWeightOf(channels);

    const chScore = Math.min(chAvg / 2, 1);

    high:{color:"#fed7aa",bg:"rgba(234,88,12,.3)",border:"#ea580c",label:"HIGH"},
    medium:{color:"#fef08a",bg:"rgba(202,138,4,.3)",border:"#ca8a04",label:"MEDIUM"},
    low:{color:"#cbd5e1",bg:"rgba(148,163,184,.2)",border:"#94a3b8",label:"LOW"}
  };
  function badgeHtml(r) {
    if (!r) return "";
    const m = LEVEL_META[r.level] || LEVEL_META.low;
    return `<div class="ai-badge" style="background:${m.bg};color:${m.color};border-color:${m.border}">🤖 ${m.label} · ${Math.round(r.total * 100)}%</div>`;
  }
  return { score, moderate, badgeHtml };
})();

  const latlngs = chain.points.map(p => [p.lat, Lon(p)]);
  if (latlngs.length < 2) {
    if (chain.heading != null && chain.points.length > 0) {
      const pred = destPoint(chain.points[0].lat, Lon(chain.points[0]), chain.heading, 25);
      if (pred) latlngs.push([pred[0], pred[1]]);
    }
    if (latlngs.length < 2) { try { showToast(t("toast.trail.empty")); } catch (e) {} return; }
  }
  chain.polyline = L.polyline(latlngs, {
    color: CONFIG.TRAIL_COLOR, weight: CONFIG.TRAIL_LINE_WIDTH, opacity: .85,
    lineJoin: "round", lineCap: "round", interactive: true, bubblingMouseEvents: false
  }).addTo(map);
  chain.polyline.on("click", (e) => {
    L.DomEvent.stopPropagation(e);
    try { map.removeLayer(chain.polyline); } catch (err) {}
    chain.polyline = null;
    if (chain.markerRef && chain.markerRef.trailPoints) {
      for (const m of chain.markerRef.trailPoints) try { map.removeLayer(m); } catch (err) {}
      chain.markerRef.trailPoints = null;
    }
    chain._trailOpen = false;
    showToast(t("toast.trail.hidden"));
  });
  const ptMarkers = [];
  const step = chain.points.length > 60 ? 6 : (chain.points.length > 30 ? 3 : (chain.points.length > 15 ? 2 : 1));
  chain.points.forEach((p, i) => {
    if (i % step !== 0 && i !== chain.points.length - 1) return;
    const m = L.marker([p.lat, Lon(p)], {
      icon: L.divIcon({
        className: "",
        html: `<div style="background:#dc2626;color:#fff;font-size:9px;font-weight:800;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border:1px solid #fff;opacity:.9">${i + 1}</div>`,
        iconSize: [14, 14], iconAnchor: [7, 7]
      }), interactive: false
    }).addTo(map);
    ptMarkers.push(m);
  });
  if (chain.markerRef) chain.markerRef.trailPoints = ptMarkers;
  chain._trailOpen = true;

}
function animateChainTransition(chainKey, from, to, marker, cls, confirmN, totalW, uncertain, aiLevel, stage, inSiren, hasPriority, onDone) {
  const dist = haversineKm(from.lat, from.lon, to.lat, to.lon);
  let dur = dist * CONFIG.CHAIN_TRANSITION_MS_PER_KM;
  dur = Math.max(CONFIG.CHAIN_TRANSITION_MIN_MS, Math.min(CONFIG.CHAIN_TRANSITION_MAX_MS, dur));
  const startTime = Date.now();
  const heading = bearingBetween(from.lat, from.lon, to.lat, to.lon);
  const prev = State.chainAnimations.get(chainKey);
  if (prev && prev.rafId) cancelAnimationFrame(prev.rafId);
  const state = { from, to, startTime, duration: dur, marker, cls, confirmN, totalW, uncertain, aiLevel, stage, inSiren, hasPriority, heading, onDone, rafId: null };
  State.chainAnimations.set(chainKey, state);
  function tick() {
    const now = Date.now();
    const prog = Math.min(1, (now - startTime) / dur);
    const et = prog < 0.5 ? 2 * prog * prog : 1 - Math.pow(-2 * prog + 2, 2) / 2;
    const lat = from.lat + (to.lat - from.lat) * et;
    const lon = from.lon + (to.lon - from.lon) * et;
    try {
      marker.setLatLng([lat, lon]);
      marker.setIcon(makeIcon(cls, heading, confirmN, totalW, false, uncertain, aiLevel, stage, inSiren, hasPriority, false));
    } catch (e) {}
    if (prog < 1) state.rafId = requestAnimationFrame(tick);
    else { State.chainAnimations.delete(chainKey); if (onDone) try { onDone(); } catch (e) {} }
  }
  state.rafId = requestAnimationFrame(tick);
}

const RUSSIAN_ORIGINS = LAUNCH_ORIGINS.filter(o => !/Крим|Крым/i.test(o.region || ""));
function nearestRussianOrigin(lat, lon) {

function findLaunchOriginsInText(text) {

  for (const o of LAUNCH_ORIGINS) {
    const re = new RegExp(o.re.source, "gi");
    let m;
    while ((m = re.exec(txt)) !== null) found.push({...o, index:m.index, length:m[0].length});
  }
  const seen = new Set();
  return found.filter(o => { if (seen.has(o.key)) return false; seen.add(o.key); return true; }).sort((a, b) => a.index - b.index);
}

function extractLaunchStage(text) {
  if (!text) return [];
  if (NON_AIR_CONTEXT_RE.test(text)) return [];
  if (CLEAR_RE.test(text)) return [];
  const cls = CLASSIFIER(text);
  if (!cls || !cls.hard) return [];
  if (cls.isStrategic) {
    const isReady = READY_RE.test(text);
    const isLaunch = LAUNCH_RE.test(text) && !/без\s+пуск|поки\s+що\s+без/i.test(text);
    if (!isReady && !isLaunch) return [];
    const bases = Strategic.findAirbases(text);
    const count = parseAircraftCount(text);
    const list = bases.length > 0 ? bases : [{ key: "unknown", name: "аеродром не вказано", lat: null, lon: null, region: "" }];
    return list.map(b => ({ kind: "strategic", key: "strat_" + b.key, name: b.name, region: b.region, lat: b.lat, lon: b.lon, cls, stage: "ready", target: null, count }));
  }
  if (cls.isAwacs) return [];
  if (OBSERVATION_TYPES.has(cls.type)) {
    if (NO_LAUNCH_RE.test(text)) return [];
    const obs = getObservedPlace(text);
    const tgt = getTargetPlace(text);
    const place = obs || tgt;
    if (!place) return [];
    return [{ kind: "observation", key: "obs_" + place.key + "_" + cls.type, name: place.name, region: "", lat: place.lat, lon: place.lon, cls, stage: null, target: tgt, count: null }];
  }
  if (NO_LAUNCH_RE.test(text) && !/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text)) return [];
  const hasLaunch = LAUNCH_RE.test(text);
  const hasThreat = THREAT_RE.test(text);
  let stage = null;
  if (hasLaunch) stage = "launch";
  else if (hasThreat) stage = "threat";
  else {
    if (["uav","geran2","geran3","geran4","geran5","jet_drone","recon","missile","zircon"].includes(cls.type)) stage = "threat";
    else return [];
  }
  if (stage !== "launch" && (cls.isJetDrone || ["missile","banderol","geran2","geran3","geran4","geran5","zircon"].includes(cls.type))) {
    if (!ACTION_RE.test(text)) return [];
  }
  if (cls.isMig) {
    const base = Strategic.findMigAirbase(text);
    if (!base) return [];
    return [{ kind: "mig", key: "mig_" + base.key, name: base.name, region: base.region, lat: base.lat, lon: base.lon, cls, stage: "takeoff", target: null }];
  }

  const res = [];

}
function extractPlaceAndType(text) {
  if (!text) return null;
  if (NON_AIR_CONTEXT_RE.test(text)) return null;
  if (CLEAR_RE.test(text)) return null;
  if (NO_LAUNCH_RE.test(text) && !/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text)) return null;
  const oblastCount = (text.match(/[А-ЯІЇЄҐ][а-яіїєґ]+щин[аиіу]:/gi) || []).length;
  if (oblastCount >= 2) return null;
  const cls = CLASSIFIER(text);
  if (!cls) return null;
  if (cls.isStrategic || cls.isMig || cls.isAwacs) return null;
  if (OBSERVATION_TYPES.has(cls.type)) return null;
  const obs = getObservedPlace(text);
  const tgt = getTargetPlace(text);
  let place = null, isApproach = false;
  if (tgt) {
    let sourceBearing = null;
    for (const d of RE.dirs) { if (d.re.test(text)) { sourceBearing = d.deg; break; } }
    if (sourceBearing == null) {
      const src = nearestRussianOrigin(tgt.lat, tgt.lon);
      if (src.origin && src.dist > CONFIG.TRAIL_MIN_ORIGIN_DIST_KM) {
        sourceBearing = bearingBetween(src.origin.lat, src.origin.lon, tgt.lat, tgt.lon);
      } else { sourceBearing = 180; }
    }
    const [lat, lon] = destPoint(tgt.lat, tgt.lon, sourceBearing, CONFIG.APPROACH_OFFSET_KM);
    place = {
      key: "approach_" + tgt.key, name: tgt.name, lat, lon,
      index: 0, length: 0, _approach: true,
      _targetLat: tgt.lat, _targetLon: tgt.lon, _targetName: tgt.name,
      _heading: (sourceBearing + 180) % 360
    };
    isApproach = true;
  } else if (obs) {
    let moveBearing = null;
    for (const d of RE.dirs) { if (d.re.test(text)) { moveBearing = d.deg; break; } }
    if (moveBearing == null) moveBearing = 0;
    const [lat, lon] = destPoint(obs.lat, obs.lon, moveBearing, CONFIG.APPROACH_OFFSET_KM);
    place = { key: obs.key, name: obs.name, lat, lon, index: obs.index, length: obs.length, _passed: true, _heading: moveBearing };
  } else {
    const sentences = text.split(/[.!?\n]+/);
    for (const s of sentences) {
      const sentence = s.trim();
      if (!sentence) continue;
      if (!cls.re.test(sentence)) continue;
      const rawPlace = findPlaceFuzzy(sentence) || findPlaceInText(sentence);
      if (rawPlace) {
        const idx = text.indexOf(sentence);
        place = {
          key: rawPlace.key, name: rawPlace.name,
          lat: rawPlace.lat, lon: rawPlace.lon,
          index: idx + (rawPlace.index || 0), length: rawPlace.length,
          _kyivArea: rawPlace._kyivArea, _fuzzy: rawPlace._fuzzy, fuzzyScore: rawPlace.fuzzyScore,
          _infra: rawPlace._infra, _chornobyl: rawPlace._chornobyl
        };
        break;
      }
    }
  }
  if (!place) return null;
  const windowStart = Math.max(0, place.index - 200);
  const windowEnd = Math.min(text.length, place.index + place.length + 200);
  const sentence2 = text.slice(windowStart, windowEnd);
  const typeMatch = new RegExp(cls.re.source, cls.re.flags).exec(sentence2);
  if (!typeMatch) return null;
  if (!cls.hard && !ACTION_RE.test(sentence2)) return null;
  const KYIV_CENTER_NAMES = new Set(["київ", "киев", "kyiv"]);
  const placeNameLower = (place.name || "").trim().toLowerCase();
  if (KYIV_CENTER_NAMES.has(placeNameLower) && !tgt && !isApproach) return null;
  return { place, cls, target: tgt, isApproach };
}

const IMPACT_REPORTS_DB = [

const SUMMARY_NEWS_RE = /(?:протягом\s+(?:минулої|останньої|цієї)\s+доби|за\s+(?:минулу|останню)\s+добу|внаслідок\s+обстріл|за\s+даними\s+(?:ова|хова|сова)|зведення\s+за\s+добу|підсумки\s+(?:доби|дня)|за\s+добу\s+ворог|станом\s+на\s+\d|офіційне\s+зведення)/i;

    }

        updateBadge("ok");
      };
      ws.onmessage = e => { try { handleFrame(JSON.parse(e.data)); } catch (err) { RadarLog.push("ws.message", err.message, err); } };
      ws.onerror = () => {};
      ws.onclose = () => {
        wsConnected = false; ws = null; updateBadge("err");
        startPolling();
        scheduleReconnect();
      };
    } catch (e) {
      startPolling();
      scheduleReconnect();
    }
  }
  const wsState = { threats: new Map() };
  function handleFrame(env) {
    if (!env || !env.type) return;
    switch (env.type) {
      case "snapshot": {
        const data = env.data || {};
        wsState.threats.clear();
        for (const tx of (data.threats || [])) if (tx.id) wsState.threats.set(tx.id, tx);
        if (data.alerts) { lastAlerts = data.alerts; try { syncAlertPolygons(data.alerts); } catch (e) {} }
        syncThreats([...wsState.threats.values()]);
        break;
      }
      case "upsert": {
        const tx = env.data;
        if (tx && tx.id) { wsState.threats.set(tx.id, tx); syncThreats([...wsState.threats.values()]); }
        break;
      }
      case "remove": {
        const data = env.data || {};
        if (data.id) wsState.threats.delete(data.id);
        syncThreats([...wsState.threats.values()]);
        break;
      }
      case "alerts": {
        const data = env.data || {};
        lastAlerts = data;
        try { syncAlertPolygons(data); } catch (e) {}
        break;
      }
    }
  }
  async function fetchMessages() {
    try {
      const r = await fetch(CONFIG.API_MESSAGES);
      if (!r.ok) throw new Error("messages " + r.status);
      const d = await r.json();
      syncMessageThreats(d.messages || []);
    } catch (e) { if (e.name !== "AbortError") RadarLog.push("fetchMessages", e.message, e); }
  }
  async function fetchThreatsAndAlerts() {
    try {
      if (abortCtrl) abortCtrl.abort();
      abortCtrl = new AbortController();
      const signal = abortCtrl.signal;
      const [tr, al] = await Promise.all([
        fetch(CONFIG.API_THREATS, { signal }).then(r => { if (!r.ok) throw new Error("threats " + r.status); return r.json(); }),
        fetch(CONFIG.API_ALERTS, { signal }).then(r => { if (!r.ok) throw new Error("alerts " + r.status); return r.json(); })
      ]);
      try { syncThreats(tr.threats || []); } catch (e) {}
      try { syncAlertPolygons(al); } catch (e) {}
      updateBadge("ok");
    } catch (e) { if (e.name !== "AbortError") updateBadge("err"); }
  }
  async function pollLoop() {
    if (wsConnected) { pollTimer = null; return; }
    await fetchThreatsAndAlerts();
    if (wsConnected) { pollTimer = null; return; }
    pollTimer = setTimeout(pollLoop, CONFIG.POLL_MS);
  }
  function startPolling() { if (pollTimer) clearTimeout(pollTimer); pollTimer = setTimeout(pollLoop, 0); }
  function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; } }
  function updateBadge(state) {
    if (state === "ok") setStatus(wsConnected ? "ok" : "warn", wsConnected ? t("status.online.ws") : t("status.online"));
    else setStatus("err", t("status.offline"));
  }
  function isConnected() { return wsConnected; }
  function getLastAlerts() { return lastAlerts; }
  function startMessagesLoop() {
    if (messagesPollerId) return;
    messagesPollerId = setInterval(() => {
      if (document.hidden) return;
      if (wsConnected && Math.floor(Date.now() / 5000) % 3 !== 0) return;
      fetchMessages();
    }, 5000);
  }
  return { connect, startPolling, stopPolling, fetchMessages, isConnected, getLastAlerts, handleFrame, startMessagesLoop };
})();

let alertLayers = [];
function syncAlertPolygons(alerts) {
  if (!alerts) return;
  for (const l of alertLayers) { try { alertLayer.removeLayer(l); } catch (e) {} }
  alertLayers = [];
  const allLists = [];
  if (alerts.raions) allLists.push(...alerts.raions);
  if (alerts.oblasts) allLists.push(...alerts.oblasts);
  if (alerts.regions) allLists.push(...alerts.regions);
  let hasKyivAlert = false;
  for (const a of allLists) {
    if (!a.geometry && !a.coords && !a.polygon) continue;
    let latlngs = null;
    try {
      if (a.geometry && a.geometry.type === "Polygon") latlngs = a.geometry.coordinates.map(ring => ring.map(c => [c[1], c[0]]));
      else if (a.geometry && a.geometry.type === "MultiPolygon") latlngs = a.geometry.coordinates.map(poly => poly.map(ring => ring.map(c => [c[1], c[0]])));
      else if (a.coords) latlngs = a.coords.map(c => [c[1], c[0]]);
      else if (a.polygon) latlngs = a.polygon.map(c => [c[1], c[0]]);
    } catch (e) { continue; }
    if (!latlngs) continue;
    const alertName = String(a.name || "") + " " + String(a.key || "");
    const isKyiv = isKyivOrOblast(alertName);
    if (isKyiv) hasKyivAlert = true;
    let color = "#dc2626", fillColor = "#dc2626";
    if (/обл/i.test(alertName) || /область/.test(alertName)) { color = "#ea580c"; fillColor = "#ea580c"; }
    try {
      const layer = L.polygon(latlngs, { color, weight: 1.5, opacity: .8, fillColor, fillOpacity: .15, interactive: isKyiv, className: "alert-polygon" });
      if (isKyiv) layer.bindPopup(`<div class="popup-title" style="color:#f87171">🚨 Повітряна тривога</div><div class="popup-meta"><b>${esc(a.name || a.key || "")}</b><br>Київ / Київська область</div>`, CONFIG.POPUP_OPTS);
      layer.addTo(alertLayer);
      alertLayers.push(layer);
    } catch (e) {}
  }
  try { AlertCounter.update(hasKyivAlert); } catch (e) {}
}

/* ==================== 27. ANIMATION ==================== */
let animRunning = false, rafId = null;
function animate() {
  if (!animRunning || !map) return;
  const now = Date.now();
  for (const tr of State.tracks.values()) {
    if (!tr._s || tr.threat.areaOnly || tr.threat.advisory) continue;
    if (tr.arrivalDone) continue;
    if (!tr.marker) continue;
    const [lat, lon] = predict(tr, now);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    tr.marker.setLatLng([lat, lon]);
    if (tr._s.hdg != null) {
      const lastH = tr._lastH || 0;
      const diff = Math.abs(((tr._s.hdg - lastH + 540) % 360) - 180);
      if (diff > 5) {
        tr._lastH = tr._s.hdg;
        tr.marker.setIcon(makeIcon(tr.threat, tr._s.hdg, 0, 0, tr.stale, tr.uncertain, null, null, tr.inSiren, false, false, tr._s.spd || tr.speed));
      }
    }
    const d = haversineKm(lat, lon, CONFIG.KYIV[0], CONFIG.KYIV[1]);
    if (d < 1.2 && !tr.arrivalDone) {
      tr.arrivalDone = true;
      tr.threat._arrived = true;
      try { tr.marker.setIcon(makeIcon(tr.threat, (tr._s && tr._s.hdg) || tr.heading, 0, 0, false, tr.uncertain, null, null, true, false, false, (tr._s && tr._s.spd) || tr.speed)); } catch (e) {}
      const markerLocal = tr.marker;
      setTimeout(() => { try { threatLayer.removeLayer(markerLocal); } catch (e) {} tr.marker = null; }, CONFIG.ARRIVED_PULSE_MS);
      const isFuzzy = !!tr.uncertain || (tr.threat.uncertaintyKm > 5);
      spawnArrival(tr, isFuzzy ? "unknown" : "impact", lat, lon, tr.threat);
    }
  }
  rafId = requestAnimationFrame(animate);
}
function startAnim() { if (animRunning) return; animRunning = true; rafId = requestAnimationFrame(animate); }
function stopAnim() { animRunning = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

/* ==================== 27.5 GEOLOCATION ==================== */
const GeoLoc = (() => {
  let watchId = null, marker = null, accuracyCircle = null;
  let lastPos = null, enabled = false, headingDeg = null;
  let lastCoords = null;
  let orientationHandler = null;
  function makeIcon() {
    const arrow = headingDeg != null ? `<div class="user-loc-arrow" style="transform:translateX(-50%) rotate(${headingDeg}deg)"></div>` : "";
    return L.divIcon({ className: "", html: `<div class="user-loc-marker">${arrow}<div class="user-loc-dot"></div></div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
  }
  function popupHtml(pos) {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy || 0);
    const spd = pos.coords.speed != null ? (pos.coords.speed * 3.6).toFixed(1) + " км/год" : "—";
    const hdg = headingDeg != null ? Math.round(headingDeg) + "°" : "—";
    return `<div class="popup-title" style="color:#22d3ee">🧭 Моє місцезнаходження</div>` + `<div class="popup-meta">${lat.toFixed(5)}, ${lon.toFixed(5)}<br>` + `Точність: <b>±${acc} м</b><br>` + `Швидкість: <b>${spd}</b><br>` + `Курс: <b>${hdg}</b></div>` + `<button type="button" class="popup-toggle-btn" id="geoCenterBtn">📌 Центрувати</button>` + `<button type="button" class="popup-remove-btn" id="geoStopBtn">🧭 Вимкнути</button>`;
  }
  function bindPopupButtons() {
    const c = document.getElementById("geoCenterBtn");
    const s = document.getElementById("geoStopBtn");
    if (c) c.onclick = (e) => { e.stopPropagation(); center(); map.closePopup(); };
    if (s) s.onclick = (e) => { e.stopPropagation(); map.closePopup(); stop(); };
  }
  function onPosition(pos) {
    lastPos = pos;
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lastCoords = { lat, lon };
    const acc = pos.coords.accuracy || 0;
    if (pos.coords.heading != null && !isNaN(pos.coords.heading) && pos.coords.speed > 0.5) headingDeg = pos.coords.heading;
    if (!marker) {
      marker = L.marker([lat, lon], { icon: makeIcon(), zIndexOffset: 3000 });
      marker.bindPopup(popupHtml(pos), { maxWidth: 260, className: "geo-popup" });
      marker.on("popupopen", bindPopupButtons);
      marker.addTo(map);
    } else {
      marker.setLatLng([lat, lon]);
      marker.setIcon(makeIcon());
      try { marker.setPopupContent(popupHtml(pos)); } catch (e) {}
    }
    if (!accuracyCircle) {
      accuracyCircle = L.circle([lat, lon], { radius: acc, className: "user-loc-accuracy", interactive: false });
      accuracyCircle.addTo(map);
    } else {
      accuracyCircle.setLatLng([lat, lon]);
      accuracyCircle.setRadius(acc);
    }
    _userPos = { lat, lon };
    try { refreshNearUserIcons(); } catch (e) {}
    try { refreshUserRels(); } catch (e) {}
  }
  function onError(err) {
    let msg = "Помилка геолокації";
    if (err.code === 1) msg = "Доступ до геолокації заборонено";
    else if (err.code === 2) msg = "Не вдалося визначити позицію";
    else if (err.code === 3) msg = "Час очікування вичерпано";
    showToast("🧭 " + msg, 3000);
  }
  function startOrientation() {
    if (orientationHandler) return;
    const handler = (e) => {
      let h = null;
      if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
      else if (e.alpha != null) h = 360 - e.alpha;
      if (h != null && !isNaN(h)) { headingDeg = h; if (marker) marker.setIcon(makeIcon()); }
    };
    const attach = () => {
      orientationHandler = handler;
      window.addEventListener("deviceorientationabsolute", handler, true);
      window.addEventListener("deviceorientation", handler, true);
    };
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(p => { if (p === "granted") attach(); }).catch(() => {});
    } else attach();
  }
  function stopOrientation() {
    if (!orientationHandler) return;
    window.removeEventListener("deviceorientationabsolute", orientationHandler, true);
    window.removeEventListener("deviceorientation", orientationHandler, true);
    orientationHandler = null;
  }
  function start() {
    if (!("geolocation" in navigator)) { showToast("🧭 Геолокація не підтримується"); return; }
    if (watchId != null) return;
    watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    enabled = true;
    const b = $("btnGeo"); if (b) b.classList.add("on");
    showToast("🧭 Геолокація увімкнена");
    startOrientation();
  }
  function stop() {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    enabled = false;
    const b = $("btnGeo"); if (b) b.classList.remove("on");
    if (marker && map) { map.removeLayer(marker); marker = null; }
    if (accuracyCircle && map) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
    stopOrientation();
    _userPos = null;
    try { refreshNearUserIcons(); } catch (e) {}
    try { refreshUserRels(); } catch (e) {}
    showToast("🧭 Геолокація вимкнена");
  }
  function toggle() { enabled ? stop() : start(); }
  function center(zoom) {
    if (!lastPos) { showToast("🧭 Позиція ще не визначена"); return; }
    const z = zoom || Math.max(map.getZoom(), 15);
    map.setView([lastPos.coords.latitude, lastPos.coords.longitude], z, { animate: true });
  }
  return { start, stop, toggle, center, isEnabled: () => enabled, getLast: () => lastCoords };
})();
window.GeoLoc = GeoLoc;

function initSearch() {
  const input = $("searchInput"), btn = $("searchBtn"), results = $("searchResults");
  if (!input || !btn || !results || !map) return;
  let searchMarker = null, debounceTimer = null;
  function hideResults() { results.classList.remove("show"); results.innerHTML = ""; }
  function showResults(items) {
    if (!items.length) { hideResults(); return; }
    results.innerHTML = items.map((it, i) => `<div class="search-item" data-idx="${i}"><div class="name">${esc(it.name)}</div><div class="addr">${esc(it.addr || "")}</div></div>`).join("");
    results.classList.add("show");
    results.querySelectorAll(".search-item").forEach(el => {
      el.addEventListener("click", () => {
        const idx = +el.dataset.idx;
        const it = items[idx];
        if (!it) return;
        map.setView([it.lat, it.lon], 14, { animate: true });
        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.marker([it.lat, it.lon], { icon: L.divIcon({ className: "", html: '<div style="background:#3b82f6;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #3b82f6"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
        const popupHtml = `<div style="min-width:140px"><b>${esc(it.name)}</b><br><span style="font-size:11px;color:#94a3b8">${esc(it.addr || "")}</span><br><button type="button" id="searchMarkerRemove" style="margin-top:8px;width:100%;height:28px;font-size:12px;border-radius:6px;background:#dc2626;color:#fff;border:0;cursor:pointer">🗑 Видалити мітку</button></div>`;
        searchMarker.bindPopup(popupHtml).openPopup();
        searchMarker.on("popupopen", () => {
          const b = document.getElementById("searchMarkerRemove");
          if (b) b.onclick = () => { if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; } showToast("Мітку видалено"); };
        });
        hideResults(); input.blur();
      });
    });
  }
  async function doSearch(q) {
    q = (q || "").trim();
    if (q.length < 2) { hideResults(); return; }
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&countrycodes=ua,by,pl,md,ro&accept-language=uk&addressdetails=1`;
      const r = await fetch(url, { headers: { "Accept-Language": "uk" } });
      const data = await r.json();
      const items = (data || []).map(d => ({ name: d.display_name.split(",")[0] || d.name || "?", addr: d.display_name, lat: +d.lat, lon: +d.lon })).filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lon));
      showResults(items);
    } catch (e) { showToast("Помилка пошуку"); hideResults(); }
  }
  btn.addEventListener("click", e => { e.preventDefault(); doSearch(input.value); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doSearch(input.value); }
    if (e.key === "Escape") { hideResults(); input.value = ""; input.blur(); showToast("Пошук очищено"); }
  });
  input.addEventListener("input", () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => doSearch(input.value), 400); });
  document.addEventListener("click", e => { if (!results.contains(e.target) && e.target !== input && e.target !== btn) hideResults(); });
}

/* ==================== 30. USER MARKERS ==================== */
function initUserMarkers() {
  const MARKERS_KEY = "kyiv_radar_user_markers_v1";
  let addMode = false;
  let userMarkers = [];
  let markerLayer = null;
  const btn = $("btnMarkers");
  if (!btn || !map) return;
  function load() { try { const raw = localStorage.getItem(MARKERS_KEY); userMarkers = raw ? JSON.parse(raw) : []; if (!Array.isArray(userMarkers)) userMarkers = []; } catch (e) { userMarkers = []; } }
  function save() { try { localStorage.setItem(MARKERS_KEY, JSON.stringify(userMarkers)); } catch (e) {} }
  function makeIcon() { return L.divIcon({ className: "", html: `<div style="background:#ea580c;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize: [18, 18], iconAnchor: [9, 18] }); }
  function popupContent(m) {
    const div = document.createElement("div");
    div.className = "user-marker-popup";
    div.innerHTML = `<input type="text" class="pm-title" placeholder="Назва мітки" value="${esc(m.title || "")}"><textarea class="pm-note" placeholder="Нотатка...">${esc(m.note || "")}</textarea><div class="pm-actions"><button type="button" class="pm-save">💾 Зберегти</button><button type="button" class="pm-del danger">🗑 Видалити</button></div>`;
    div.querySelector(".pm-save").addEventListener("click", () => {
      m.title = div.querySelector(".pm-title").value.trim() || "Мітка";
      m.note = div.querySelector(".pm-note").value.trim();
      save(); showToast("Мітку збережено");
    });
    div.querySelector(".pm-del").addEventListener("click", () => {
      if (m._leaflet) markerLayer.removeLayer(m._leaflet);
      userMarkers = userMarkers.filter(x => x.id !== m.id);
      save(); showToast("Мітку видалено");
    });
    return div;
  }
  function render() {
    if (markerLayer) markerLayer.clearLayers();
    else markerLayer = L.layerGroup().addTo(map);
    userMarkers.forEach(m => {
      const marker = L.marker([m.lat, m.lng], { icon: makeIcon(), draggable: true }).bindPopup(popupContent(m), { maxWidth: 240, className: "user-marker-popup" }).addTo(markerLayer);
      marker.on("dragend", () => { const ll = marker.getLatLng(); m.lat = ll.lat; m.lng = ll.lng; save(); });
      m._leaflet = marker;
    });
  }
  function addAt(lat, lng) {
    const m = { id: Date.now() + "_" + Math.random().toString(36).slice(2, 7), lat, lng, title: "Мітка", note: "" };
    userMarkers.push(m); save(); render();
    if (m._leaflet) m._leaflet.openPopup();
    showToast("Мітку додано — натисніть щоб редагувати");
  }
  function setAddMode(on) {
    addMode = !!on;
    btn.classList.toggle("on", addMode);
    map.getContainer().style.cursor = addMode ? "crosshair" : "";
    showToast(addMode ? "Клікніть на карту, щоб поставити мітку" : "Режим міток вимкнено");
  }
  btn.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); Audio.unlock(); setAddMode(!addMode); });
  map.on("click", e => { if (!addMode) return; addAt(e.latlng.lat, e.latlng.lng); });
  load(); render();
  window.clearUserMarkers = function() { userMarkers = []; save(); if (markerLayer) markerLayer.clearLayers(); };
}

/* ==================== 31. FULLSCREEN ==================== */
function initFullscreen() {
  const btn = $("btnFullscreen");
  if (!btn) return;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement); }
  function getReq(el) { return el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen || el.msRequestFullscreen || null; }
  function getExit() { return document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen || null; }
  function update() { btn.classList.toggle("on", isFs()); }
  btn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); Audio.unlock();
    try {
      if (isFs()) { const ex = getExit(); if (ex) ex.call(document); else showToast("Fullscreen не підтримується"); }
      else {
        const el = document.documentElement;
        const req = getReq(el);
        if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => showToast("Fullscreen заблоковано браузером")); }
        else showToast("На iOS: Додати на Home-екран для повного екрану");
      }
    } catch (err) { showToast("Fullscreen недоступний"); }
    setTimeout(update, 300);
  });
  document.addEventListener("fullscreenchange", update);
  document.addEventListener("webkitfullscreenchange", update);
  update();
}

/* ==================== 32. THEME ==================== */
function initTheme() {
  const KEY = "kyiv_radar_theme_v1";
  window.__radarTheme = "military";
  try { window.__radarTheme = localStorage.getItem(KEY) || "military"; } catch (e) {}
  window.applyRadarTheme = function(theme) {
    const tt = (theme === "clean") ? "clean" : "military";
    window.__radarTheme = tt;
    document.documentElement.setAttribute("data-theme", tt);
    try { localStorage.setItem(KEY, tt); } catch (e) {}
  };
  window.applyRadarTheme(window.__radarTheme);
}

/* ==================== 33. INIT ==================== */
function loadSettings() {
  try { if (localStorage.getItem("kyiv_rings_v41") === "1") ringsVisible = true; } catch (e) {}
  try { if (localStorage.getItem("kyiv_settlements_v41") === "1") settlementsVisible = true; } catch (e) {}
  try { if (localStorage.getItem("kyiv_strategic_v41") === "1") strategicVisible = true; } catch (e) {}
  try { const v = localStorage.getItem("kyiv_infra_mode_v41"); if (v != null) { const i = +v; if (i >= 0 && i <= 4) infraMode = i; } } catch (e) {}
  try { if (localStorage.getItem("kyiv_power_vis_v1") === "1") powerVisible = true; } catch (e) {}
  try { const cb = localStorage.getItem("kyiv_base_map"); if (cb === "osm" || cb === "sat") currentBase = cb; } catch (e) {}
}
async function init() {
  try {
    setStatus("warn", t("status.loading"));
    loadSettings();
    initMap();
    if (currentBase === "osm" && baseSat && map.hasLayer(baseSat)) {
      map.removeLayer(baseSat);
      if (!osmLayer) osmLayer = L.tileLayer(CONFIG.TILE_URL, { maxZoom: 19, attribution: CONFIG.TILE_ATTR });
      osmLayer.addTo(map);
    }
    initTheme();
    initUI();
    initSearch();
    initUserMarkers();
    initFullscreen();
    applyScopeMode(false);
    Net.connect();
    Net.fetchMessages();
    Net.startMessagesLoop();
    startAnim();
    Feed.render();
    setInterval(Feed.render, 8000);
    setTimeout(() => Audio.unlock(), 500);
    updateSettlementsVisibility();
    if (strategicVisible && strategicLayer && map && !map.hasLayer(strategicLayer)) strategicLayer.addTo(map);
    const b = $("btnInfra");
    if (b) {
      b.classList.remove("on", "infrastructure", "energy", "incidents");
      if (infraMode === 1) b.classList.add("infrastructure");
      else if (infraMode === 2) b.classList.add("energy");
      else if (infraMode === 3) b.classList.add("incidents");
      else if (infraMode === 4) b.classList.add("on");
    }
    if (infraMode > 0) rebuildInfraLayer();
    if (powerVisible) rebuildPowerLayer();
    applyLang();
    window.findNearestInfra = findNearestInfra;
    window.KYIV_INFRA = { bridges: KYIV_BRIDGES, energy: ENERGY_DB, infrastructure: INFRASTRUCTURE_OBJECTS, incidents: INCIDENT_OBJECTS, power: KYIV_SUBSTATIONS };
    window.RadarParse = {
      extractDroneId, parseTarget, parseEvents, estimateAltitude, formatAltRange, estimateSpeedKmh,
      detectCategory, hasMovement, classifyThreat, CLASSIFIER, detectExactName,
      estimateKinematics, observedSpeedFromPoints, predictPosition, predictTowardKyiv,
      kinematicsFor, resolveSpeedKmh, etaToKyivMin, KINEMATICS,
      detectMessageRole, geometryGate, resolveTrailKey, typeBucket, geoGridKey, UAV_ACC,
      normalizeChannel, uniqueChannels, uniqueChannelCount, confirmStats, inKyivOblast,
      Lon, normLon
    };
    console.log("[radar] ready v15.8 — STABLE, без ИИ. UK-only, WS-priority, restored impact markers.");
  } catch (e) { RadarLog.push("init", e.message, e); RadarLog.showBanner("init: " + (e && e.message || e)); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
